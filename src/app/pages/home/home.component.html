<section class="home-banner-swiper">
    <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <ng-container *ngFor="let b of banners; let i=index">
                <button type="button" data-bs-target="#carouselExampleIndicators" [attr.data-bs-slide-to]="i"
                    [class.active]="i === 0" aria-current="true" aria-label="Slide 1"></button>
            </ng-container>

        </div>
        <div class="carousel-inner">
            <div class="carousel-item" *ngFor="let b of banners; let i = index" [class.active]="i === 0">
                <img  [src]="b.imageName" [alt]="b.name" [title]="b.name"  (click)="gotoroute(b.type, b.seoName)" 
                    class="img-fluid w-100 d-none d-md-block">
                    <!-- <span *ngFor="let ba of mobileBanners">
                        <img  [src]="ba.imageName" alt="category list" class="img-fluid w-100 d-md-none d-block" (click)="gotoroute(b.type, b.seoName)" >
                    </span> -->
                <!-- <img  src="assets/images/adbanner01.jpg" alt="category list" class="img-fluid w-100 d-md-none d-block"> -->
            </div>
            <div class="carousel-item" *ngFor="let ba of mobileBanners; let i = index" [class.active]="i === 0">
                <!-- <span *ngFor="let ba of mobileBanners"> -->
                    <img  [src]="ba.imageName" alt="category list" class="img-fluid w-100 d-md-none d-block" (click)="gotoroute(ba.type, ba.seoName)">
                <!-- </span> -->
                <!-- <img  src="assets/images/adbanner01.jpg" alt="category list" class="img-fluid w-100 d-md-none d-block"> -->
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
</section>
<app-categories *ngIf="iconicBanners" [iconicBanners]="iconicBanners"></app-categories>

<app-category-banners *ngIf="smallBanners" [smallBanners]="smallBanners"></app-category-banners>

<section class="categories-all">
    <div class="custom-container">
        <div class="row justify-content-center border-bottom pb-3">
            <div class="col-12 text-center">
                <h4 class="h4 font-semibold">Most Popular Categories</h4>
            </div>
        </div>
        <div class="row py-2 py-md-4">
            <div class="col-lg-2 col-6 col-sm-4" *ngFor="let category of subCategoryBanners">
                <div class="cat-col">
                    <!-- <a href="#">
                        <figure>
                            <img [src]="item.imageName" [alt]="item.name" class="img-fluid w-100 rounded">
                        </figure>
                        <a [routerLink]="'/'+city + '/send-online/' + item.seoProductName"
                            href="javascript:void(0)">{{item.productName}}</a>
                        <h6 class="text-center py-3">
                            {{item.name}}
                        </h6>
                    </a> -->
                    <a class="category-col"
                        (click)="gotoroute(category.type, category.seoName)" href="javascript:void(0)">
                        <figure>
                            <img [src]="category.imageName"  alt={{category.name}} title={{category.name}} class="w-100">
                        </figure>
                        <h6 class="py-2 text-center">{{category.name}}</h6>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>


<ng-container *ngFor="let cat of productSecions">

    <section class="product-row py-2 py-md-4">
        <div class="section-heading">
            <div class="custom-container">
                <div class="row justify-content-between border-bottom pb-3">
                    <div class="col-8">
                        <h4 class="h4 font-semibold">{{cat.sectionType}}</h4>
                    </div>
                    <div class="col-4 text-end">
                        <a [href]="cat.sectionURL" class="color-btn">View All</a>
                    </div>
                </div>
            </div>
        </div>

        <section class="custom-container">
            <div class="products-list mt-3">
                <div class="row g-2">
                    <!-- <div class="col-md-3 col-6" *ngFor="let productitem of cat.productList  | slice:0:4"> -->
                    <owl-carousel-o [options]="customOptions">
                        <ng-template carouselSlide *ngFor="let Productvalue1 of cat.productList">
                            <app-product-item [Productvalue]="Productvalue1" class="app-product-col"></app-product-item>
                        </ng-template>
                    </owl-carousel-o>
                    <!-- <app-product-item [Productvalue]="productitem" class="app-product-col"></app-product-item> -->
                    <!-- </div> -->
                </div>
            </div>
        </section>
    </section>
</ng-container>


<div>
    <div class="custom-container">
        <app-terms-content></app-terms-content>
    </div>
</div>
